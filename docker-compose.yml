services:

  llm_ollama-chat:
    image: ollama/ollama:0.6.6
    ports:
      - 11438:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: llm_ollama-chat
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [ gpu ]
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

  llm_ollama-chat-tools:
    image: ollama/ollama:0.6.6
    ports:
      - 11439:11434
    volumes:
      - .:/code
      - ./ollama/ollama:/root/.ollama
    container_name: llm_ollama-chat-tool
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [ gpu ]
    pull_policy: always
    tty: true
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
